    <h1>Installation Guide</h1>
    <p>Get Acme up and running in your project in under 5 minutes.</p>
    <h2>Prerequisites</h2>
    <p>Node.js 18 or later and npm 9 or later are required.</p>
    <h2>Quick Install</h2>
    <p>Run: npm install --save-dev acme-tools</p>
    <h2>Verify Installation</h2>
    <p>Run npx acme --version to confirm everything is working.</p>
  </main>
